# Gera a animação "snake" do gráfico de contribuições e publica no branch `output`.
#
# Decisões de segurança (supply chain):
# - Actions fixadas por SHA de commit: uma tag pode ser movida para código malicioso, um SHA não.
#   O Dependabot (.github/dependabot.yml) abre PR quando sair versão nova.
# - O job que roda código de terceiro (generate) só recebe token de leitura.
# - O job que tem permissão de escrita (publish) só roda git e actions oficiais do GitHub.
name: snake

on:
  schedule:
    - cron: "17 6 * * *" # todo dia às 06:17 UTC (03:17 em Brasília)
  workflow_dispatch: # botão "Run workflow" para rodar na hora

permissions: {} # nada por padrão; cada job pede só o que precisa

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Gerar SVGs do snake (claro e escuro)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0b0b0c&color_dots=#ebedf0,#d9c7f5,#b994ef,#9461e6,#6a2fc4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f2f2f2&color_dots=#161b22,#2e1f4d,#4a2c85,#6e3fc8,#a36bff

      - name: Guardar os SVGs para o próximo job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Baixar os SVGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake
          path: dist

      - name: Publicar no branch output
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snake: atualização automática"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
